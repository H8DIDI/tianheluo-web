<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="一键编号示意图">
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;fill:#e8eaf0}
.m{fill:#8a93a6;font-size:15px}.h{font-size:18px;font-weight:700}.c{font-size:16px}
.well{fill:#10B981;fill-opacity:.2;stroke:#10B981;stroke-width:2}.chip{fill:#161b26;stroke:#2a3244;stroke-width:1.5}
</style>
<rect width="960" height="420" rx="18" fill="#0d1017" stroke="#1e2430"/>
<text x="60" y="62" class="h">按位置自动排号，写入「标记」</text>
<rect class="chip" x="60" y="84" width="170" height="34" rx="17"/><text x="145" y="107" class="m" text-anchor="middle" style="fill:#e8eaf0">前缀：11KV-</text>
<rect class="chip" x="244" y="84" width="150" height="34" rx="17"/><text x="319" y="107" class="m" text-anchor="middle" style="fill:#e8eaf0">起始数字：1</text>
<rect class="chip" x="408" y="84" width="190" height="34" rx="17"/><text x="503" y="107" class="m" text-anchor="middle" style="fill:#e8eaf0">注释含：11kv</text>
<rect class="chip" x="612" y="84" width="210" height="34" rx="17"/><text x="717" y="107" class="m" text-anchor="middle" style="fill:#e8eaf0">方向：从左到右</text>
<rect class="well" x="100" y="226" width="56" height="56" rx="8"/><text x="128" y="206" class="c" text-anchor="middle">11KV-01</text>
<rect class="well" x="250" y="172" width="56" height="56" rx="8"/><text x="278" y="152" class="c" text-anchor="middle">11KV-02</text>
<rect class="well" x="400" y="240" width="56" height="56" rx="8"/><text x="428" y="220" class="c" text-anchor="middle">11KV-03</text>
<rect class="well" x="580" y="190" width="56" height="56" rx="8"/><text x="608" y="170" class="c" text-anchor="middle">11KV-04</text>
<rect class="well" x="760" y="232" width="56" height="56" rx="8"/><text x="788" y="212" class="c" text-anchor="middle">11KV-05</text>
<path d="M80 340h780M848 328l14 12-14 12" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="326" class="m">X 轴递增：按每口井外包框中心点的 X 坐标从小到大排</text>
<text x="60" y="394" class="m">示意图：只处理「常规模型」，序号至少两位；也可选从右到左、从下到上、从上到下</text>
</svg>
