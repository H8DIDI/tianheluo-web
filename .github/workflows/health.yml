name: health

# 每天检查一次线上网站：页面、跳转、404、插件包和宿主包的 SHA256、证书有效期……
# 任何一项失败，这次运行就会标红，GitHub 会给仓库所有者发邮件。也可以在 Actions 页面手动运行。
on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 线上健康检查
        run: python tools/healthcheck.py
