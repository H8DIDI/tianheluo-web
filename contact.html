<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交流群与联系 — 天河落</title>
<meta name="description" content="加微信 didi 进 Revit 插件交流群：提修改建议、反馈插件体验、自主投稿插件。也可以发邮件到 jiajiabimer@gmail.com。">
<meta name="theme-color" content="#070709">
<link rel="icon" href="/favicon-production.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/fx.css">
<style>
.contact{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-top:28px;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.03);max-width:560px}
.contact img{width:180px;height:180px;border-radius:12px;background:#fff;padding:8px;flex:none}
.contact ul{margin:0;padding-left:20px;line-height:2;flex:1;min-width:200px}
</style>
</head>
<body>
<header class="nav" id="nav"></header>
<main>
<div class="wrap" style="padding-top:56px">
  <div class="eyebrow">交流群</div>
  <h2>加微信，进 Revit 插件交流群</h2>
  <p class="sub">扫码添加微信 <b>didi</b>（备注“天河落”），拉你进群。群里可以：</p>
  <div class="contact">
    <img src="/wechat-didi.png" alt="微信二维码 didi" width="180" height="180">
    <ul>
      <li>对插件提<b>修改建议</b>、报告问题</li>
      <li>分享你的<b>使用体验</b></li>
      <li><b>自己做的插件</b>想上架，直接说，也可发邮件</li>
      <li>想要什么新插件，告诉我</li>
    </ul>
  </div>
  <p class="sub" style="margin-top:32px">不方便用微信？发邮件到 <a href="mailto:jiajiabimer@gmail.com">jiajiabimer@gmail.com</a>。投稿规范见 <a href="/developers">开发者页面</a>。</p>
  <p class="sub">想看源码或提 issue：<a href="https://github.com/H8DIDI/tianheluo-core" target="_blank" rel="noopener">GitHub · tianheluo-core</a>。</p>
  <p class="sub" style="font-size:13px;opacity:.7">二维码过期或扫不出来时，请发邮件告诉我。</p>
</div>
</main>
<footer id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
